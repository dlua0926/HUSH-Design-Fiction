<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUSH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Manrope:wght@200;300;400;500;600;700&display=swap">
<style>
/* HUSH final prototype. One dark room-like stage; one device centred and scaled to fit; the iPad report and browser pages carry their own light tokens. */
:root {
  color-scheme: dark;
  --bg: #0d0c0b;
  --wall-hi: #34302a;
  --wall-mid: #1d1b18;
  --wall-lo: #0f0e0d;
  --desk: #2a221b;
  --ink: #eeebe5;
  --ink-2: #bdb7ad;
  --ink-3: #8c867c;
  --ink-4: #5f5a52;
  --glass: #101113;
  --card: rgba(255, 255, 255, 0.055);
  --card-2: rgba(255, 255, 255, 0.085);
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.14);
  --coral: #e7a796;
  --coral-bg: rgba(214, 124, 104, 0.15);
  --coral-line: rgba(214, 124, 104, 0.34);
  --mint: #a9dcbb;
  --mint-bg: rgba(122, 196, 150, 0.14);
  --mint-line: rgba(122, 196, 150, 0.34);
  --halo-grey: 150 166 186;
  --halo-green: 138 214 168;
  --halo-warm: 247 226 190;
  --metal-1: #8e8b86;
  --metal-2: #dedbd5;
  --metal-3: #6b6864;
  --metal-4: #c3bfb8;
  --btn-light: #ece9e3;
  --btn-light-ink: #17181a;
  --focus: #f4dcae;
  --cue: 244 220 174;
  --dim: rgba(8, 8, 9, 0.72);
  /* light surfaces (browser, calendar, report) */
  --l-bg: #ece9e4;
  --l-panel: #f6f4f0;
  --l-card: #fdfcfa;
  --l-ink: #222120;
  --l-ink-2: #67625b;
  --l-ink-3: #9a948b;
  --l-line: #e1ddd6;
  --l-line-2: #d3cec6;
  --l-accent: #c47a64;
  --l-accent-bg: #f3e3dd;
  --l-blue: #5a6e8c;
  --l-green: #5f8f6f;
  --l-dark: #232528;
  --l-bar: #9aa3a7;
  --l-bar-2: #5f6a70;
  --font-ui: "Manrope", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mark: "Jost", "Futura", "Avenir Next", "Century Gothic", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
p { margin: 0; }
svg.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app {
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 10px;
  background: radial-gradient(120% 90% at 50% 38%, var(--wall-hi) 0%, var(--wall-mid) 46%, var(--wall-lo) 100%);
  transition: background .6s ease;
  overflow-x: hidden;
}
.app[data-scene="desk"] { background: radial-gradient(90% 70% at 50% 30%, #2b2722 0%, #181613 55%, #0d0c0b 100%), var(--bg); }
.app[data-scene="desk"]::after, .app[data-scene="office"]::after { content: ""; }
.app[data-scene="office"] { background: radial-gradient(90% 70% at 50% 30%, #2a2d30 0%, #17191b 55%, #0c0d0e 100%), var(--bg); }
.app[data-scene="sofa"] { background: radial-gradient(110% 70% at 50% 40%, #241f1b 0%, #13110f 60%, #0a0909 100%), var(--bg); }
.app[data-scene="report"] { background: radial-gradient(100% 80% at 50% 40%, #3a352f 0%, #201d1a 55%, #121110 100%), var(--bg); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 6px; min-width: 0; }
.wm { font-family: var(--font-mark); font-weight: 300; letter-spacing: .42em; text-transform: uppercase; padding-left: .42em; }
.bar .wm { font-size: 15px; color: var(--ink); }
.controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 2px; background: rgba(0,0,0,.2); }
.seg span { font-size: 12px; padding: 4px 10px; border-radius: 999px; color: var(--ink-3); transition: background .2s, color .2s; }
.app[data-mode="guided"] .seg .s-g, .app[data-mode="demo"] .seg .s-d { background: var(--card-2); color: var(--ink); }
.tbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); padding: 6px 10px; border-radius: 999px; border: 1px solid transparent; }
.tbtn:hover { border-color: var(--line-2); color: var(--ink); }
.tbtn svg.ic { width: 15px; height: 15px; }

.stage { flex: 1 1 auto; display: flex; flex-direction: column; align-items: stretch; gap: 8px; min-width: 0; position: relative; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; min-height: 22px; min-width: 0; }
.caption { font-size: 12.5px; color: var(--ink-2); letter-spacing: .01em; min-width: 0; }
.progress { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-3); min-width: 0; }
.progress .dots { display: inline-flex; align-items: center; gap: 4px; }
.progress .d { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4); opacity: .55; }
.progress .d.done { background: var(--ink-3); opacity: .9; }
.progress .d.now { background: var(--ink); opacity: 1; width: 14px; border-radius: 3px; }
.progress .fork { width: 10px; height: 1px; background: var(--ink-4); }
.progress .plabel { letter-spacing: .06em; text-transform: uppercase; }
.view { position: relative; display: flex; justify-content: center; align-items: center; min-width: 0; flex: 1 1 auto; }
.fit { position: relative; flex: none; }
.fit-inner { position: absolute; left: 0; top: 0; transform-origin: 0 0; display: grid; place-items: center; }
.fit-inner.fade { animation: fade .28s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.below { min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; text-align: center; }
.hint { font-size: 13px; color: var(--ink-2); min-height: 18px; }
.keys { font-size: 11px; color: var(--ink-4); }
.keys b { font-weight: 500; color: var(--ink-3); }
.app[data-mode="demo"] .hint, .app[data-mode="demo"] .keys { visibility: hidden; }
.nextchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 14px; background: rgba(255,255,255,.04); }
.nextchip:hover { background: rgba(255,255,255,.08); }
.nextchip[hidden] { display: none; }
.app[data-mode="demo"] .nextchip { display: none; }
.stagenote { position: absolute; left: 50%; bottom: 100%; margin-bottom: 14px; transform: translateX(-50%); font-size: 13px; color: var(--ink-3); letter-spacing: .02em; white-space: nowrap; }

/* guided cue ring */
.app[data-mode="guided"] .cue { position: relative; }
.app[data-mode="guided"] .cue::after {
  content: ""; position: absolute; inset: -6px; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 0 2px rgb(var(--cue) / .75);
  animation: cue 1.8s ease-in-out infinite;
}
@keyframes cue { 0%, 100% { box-shadow: 0 0 0 2px rgb(var(--cue) / .7), 0 0 0 0 rgb(var(--cue) / .35); } 50% { box-shadow: 0 0 0 2px rgb(var(--cue) / .9), 0 0 0 9px rgb(var(--cue) / 0); } }

/* shared UI atoms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 14px; font-size: 15px; font-weight: 600; letter-spacing: .005em; transition: transform .15s ease, background .2s; }
.btn:active { transform: scale(.985); }
.btn.light { background: var(--btn-light); color: var(--btn-light-ink); }
.btn.light:hover { background: #fff; }
.btn.ghost { border: 1px solid var(--line-2); color: var(--ink); background: rgba(255,255,255,.04); font-weight: 500; }
.btn.ghost:hover { background: rgba(255,255,255,.09); }
.btn.dark { background: var(--l-dark); color: #f4f2ee; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 3px 9px; border: 1px solid; white-space: nowrap; }
.pill.coral { color: var(--coral); background: var(--coral-bg); border-color: var(--coral-line); }
.pill.mint { color: var(--mint); background: var(--mint-bg); border-color: var(--mint-line); }
.pill.grey { color: var(--ink-2); background: rgba(255,255,255,.05); border-color: var(--line-2); }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* ---------- HUB ---------- */
.hubwrap { width: 640px; height: 640px; display: grid; place-items: center; }
.hub {
  --h: var(--halo-grey);
  position: relative; width: 600px; height: 600px; border-radius: 50%; padding: 13px;
  background: conic-gradient(from 200deg, var(--metal-1), var(--metal-2) 12%, var(--metal-3) 27%, var(--metal-4) 42%, var(--metal-3) 58%, var(--metal-2) 74%, var(--metal-1) 88%, var(--metal-1));
  box-shadow: 0 0 0 1px rgba(0,0,0,.45), 0 30px 60px rgba(0,0,0,.45), 0 0 90px 26px rgb(var(--h) / .16), 0 0 240px 90px rgb(var(--h) / .09);
  transition: box-shadow .8s ease;
}
.hub::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; pointer-events: none;
  background: conic-gradient(from 300deg, rgb(var(--h) / .95), rgb(var(--h) / .25) 18%, transparent 32%, transparent 62%, rgb(var(--h) / .35) 80%, rgb(var(--h) / .95));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px), #000 100%);
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px), #000 100%);
  filter: blur(1.5px); transition: background .8s ease; }
.hub-glass { position: relative; width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
  background: radial-gradient(120% 90% at 30% 15%, #2a2b2f 0%, #141518 45%, #0b0b0c 100%);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.7), inset 0 0 36px rgba(0,0,0,.85); }
.hub-glass::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  background: linear-gradient(155deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,0) 32%); }
.hub-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 44px; }
.hub-top { position: relative; width: 300px; display: flex; justify-content: center; align-items: center; height: 18px; }
.hub-top .wm { font-size: 13px; color: var(--ink-2); }
.hub-top .tl, .hub-top .tr { position: absolute; top: 50%; transform: translateY(-50%); display: flex; gap: 10px; color: var(--ink-3); }
.hub-top .tl { left: 8px; } .hub-top .tr { right: 8px; }
.iconbtn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line); background: rgba(255,255,255,.03); }
.iconbtn:hover { color: var(--ink); border-color: var(--line-2); }
.iconbtn svg.ic { width: 16px; height: 16px; }
.hub-clock { margin-top: 12px; font-weight: 200; font-size: 44px; line-height: 1; letter-spacing: -.01em; color: var(--ink); }
.hub-clock small { font-size: 14px; font-weight: 400; margin-left: 5px; color: var(--ink-2); letter-spacing: .02em; }
.hub-date { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
.hcard { width: 424px; background: var(--card); border: 1px solid var(--line); border-radius: 22px; text-align: left; }
.dial { margin-top: 18px; display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 20px; align-items: center; padding: 14px 18px 14px 14px; transition: background .2s, border-color .2s; }
button.dial:hover { background: var(--card-2); border-color: var(--line-2); }
.ring { position: relative; width: 124px; height: 124px; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .trk { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 3; }
.ring .arc { fill: none; stroke: rgb(var(--h)); stroke-width: 3; stroke-linecap: round; }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 2px; }
.ring .big { font-weight: 200; font-size: 34px; line-height: 1; letter-spacing: -.01em; color: var(--ink); }
.ring .unit { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.dial .lab { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 8px; }
.rows { display: grid; gap: 6px; }
.rows .r { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); min-width: 0; }
.rows .r svg.ic { width: 14px; height: 14px; color: var(--ink-3); }
.dial .more { margin-top: 10px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); }
.dial .more svg.ic { width: 13px; height: 13px; }
.hcard.stat { margin-top: 10px; padding: 12px 18px 12px; }
.hcard .h { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; letter-spacing: .02em; }
.srow { display: flex; align-items: center; gap: 10px; height: 25px; font-size: 13.5px; color: var(--ink); min-width: 0; }
.srow svg.ic { width: 16px; height: 16px; color: var(--ink-2); }
.srow .nm { flex: 1 1 auto; min-width: 0; }
.hfoot { margin-top: 10px; width: 340px; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.hfoot svg.ic { color: var(--ink-3); }
.hfoot .t1 { font-size: 13px; color: var(--ink); }
.hfoot .t2 { font-size: 11.5px; color: var(--ink-3); }
.hubbuy { margin-top: 12px; width: 340px; }
.hub-title { margin-top: 26px; font-size: 22px; font-weight: 400; letter-spacing: -.005em; }
.hub-lead { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); width: 360px; text-align: center; line-height: 1.45; }
.zero { margin-top: 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 22px; align-items: center; padding: 16px 22px; width: 400px; }
.zero .n { font-weight: 200; font-size: 64px; line-height: .9; }
.zero .nl { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; max-width: 90px; line-height: 1.3; }
.hubbtns { margin-top: 14px; display: grid; gap: 8px; width: 360px; }
.hubbtns .btn { width: 100%; }
.st-back { position: absolute; left: 0; }
.act-pill { margin-top: 20px; }
.count { margin-top: 12px; font-weight: 200; font-size: 96px; line-height: 1; letter-spacing: -.02em; color: var(--ink); }
.count-l { margin-top: 6px; font-size: 13px; color: var(--ink-3); }
.earlier { margin-top: 8px; font-size: 12px; color: var(--ink-3); opacity: .85; }
.hcard.paused { margin-top: 16px; width: 380px; padding: 10px 18px; }
.hcard.paused .srow { height: 28px; }
.prot { margin-top: 12px; font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.prot svg.ic { width: 14px; height: 14px; }

/* ---------- DOCK (matches the physical prototype: white frame, sage base, two antennas) ---------- */
.dockwrap { width: 900px; height: 640px; display: grid; place-items: center; }
.dock { position: relative; width: 820px; padding-top: 64px; }
.dock .ant { position: absolute; top: 0; width: 22px; height: 132px; border-radius: 11px; z-index: 0;
  background: linear-gradient(90deg, #9cab98 0%, #c9d3c4 42%, #a7b5a3 100%); box-shadow: inset 0 -8px 10px rgba(0,0,0,.08), 0 6px 14px rgba(0,0,0,.25); }
.dock .ant::after { content: ""; position: absolute; left: 3px; right: 3px; bottom: 6px; height: 16px; border-radius: 4px; background: rgba(0,0,0,.08); }
.dock .ant.l { left: 62px; transform: rotate(-13deg); transform-origin: 50% 100%; }
.dock .ant.r { right: 62px; transform: rotate(13deg); transform-origin: 50% 100%; }
.dframe { position: relative; z-index: 1; border-radius: 7px; padding: 28px 30px 52px;
  background: linear-gradient(165deg, #faf9f6 0%, #eceae4 55%, #dedbd4 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.8), inset 0 0 0 1px rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.18), 0 34px 60px rgba(0,0,0,.5); }
.dframe::before { content: ""; position: absolute; inset: 13px 13px 38px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06), inset 0 2px 6px rgba(0,0,0,.06); pointer-events: none; }
.dbezel { position: relative; background: #141415; border-radius: 15px; padding: 11px; box-shadow: inset 0 0 0 1px #000, 0 1px 0 rgba(255,255,255,.5); }
.dbezel::before { content: ""; position: absolute; left: 4px; top: 50%; width: 3px; height: 3px; border-radius: 50%; background: #2a2b2e; }
.dbrand { position: absolute; right: 34px; bottom: 14px; display: flex; align-items: center; gap: 12px; font-family: var(--font-mark); font-weight: 400; font-size: 17px; letter-spacing: .2em; color: #283a31; }
.dbrand i { width: 17px; height: 17px; border-radius: 50%; background: #8fa08c; box-shadow: inset 0 -2px 3px rgba(0,0,0,.22); }
.dbase { position: relative; z-index: 0; margin: -22px -14px 0; height: 58px; border-radius: 10px;
  background: linear-gradient(180deg, #9aaa97 0%, #889a85 55%, #758772 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 26px 40px rgba(0,0,0,.45); }
.dbase::after { content: ""; position: absolute; inset: 0; border-radius: 10px; opacity: .35; background: repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, rgba(0,0,0,.04) 2px 4px); }

.dscreen { position: relative; width: 736px; height: 440px; border-radius: 7px; overflow: hidden; display: flex; flex-direction: column;
  background: #efede8; color: #23231f; font-family: var(--font-ui); text-align: left; }
.dscreen.green { background: radial-gradient(70% 60% at 50% 30%, #2a3a2f 0%, #1c2720 60%, #161f19 100%); color: #e3ebe2; }
.dk-cap { font-size: 9.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
.dhead { flex: none; height: 52px; display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; padding: 0 18px; border-bottom: 1px solid #dcd8d0; }
.dscreen.green .dhead { border-bottom-color: rgba(255,255,255,.08); }
.dhead .dt { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; }
.dlogo { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid currentColor; display: grid; place-items: center; font-family: var(--font-mark); font-size: 13px; font-weight: 400; }
.dhbtn { justify-self: end; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: inherit; }
.dhbtn.l { justify-self: start; }
.dhbtn:hover { background: rgba(0,0,0,.05); }
.dhbtn svg.ic { width: 16px; height: 16px; }
.dtime { margin-top: 12px; text-align: center; font-size: 11px; letter-spacing: .12em; color: #6e6b64; }
.dhero { margin: 6px 72px 0; display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 30px; padding: 0; border-radius: 10px; text-align: left; }
button.dhero:hover { background: rgba(0,0,0,.025); }
.dhero .dk-cap { color: #23231f; }
.dbig { font-family: var(--font-mark); font-weight: 300; font-size: 104px; line-height: .95; letter-spacing: -.01em; }
.dbig-l { margin-top: 2px; text-align: right; font-size: 13.5px; color: #6e6b64; max-width: 300px; }
.dring { position: relative; width: 134px; height: 134px; border-radius: 50%; display: grid; place-items: center; }
.dring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dring .t1 { fill: none; stroke: #d6d2ca; stroke-width: 1.2; }
.dring .t2 { fill: none; stroke: #e2ded7; stroke-width: 1; }
.dring .arc { fill: none; stroke: #8fa08c; stroke-width: 2.5; stroke-linecap: round; }
.dring .v { position: relative; text-align: center; }
.dring .v b { display: block; font-family: var(--font-mark); font-weight: 300; font-size: 40px; line-height: 1; }
.dring .v span { display: block; margin-top: 6px; font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: #8b877f; }
.dring .cdot { position: absolute; top: 3px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #c9694f; }
.dstats { margin: 14px 64px 0; padding-top: 14px; border-top: 1px solid #dcd8d0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); }
.dstats div { text-align: center; padding: 2px 8px; }
.dstats div + div { border-left: 1px solid #dcd8d0; }
