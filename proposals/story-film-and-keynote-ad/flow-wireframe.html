<style>
/* Layout: low-fi storyboard. Flow map on top, one device frame in the middle, design notes beside it. Pencil-on-paper palette so nobody mistakes it for final UI. */
:root {
  --paper: #f2f3f0;
  --sheet: #fbfbf9;
  --ink: #1f2328;
  --soft: #6b7078;
  --line: #c9ccc6;
  --pencil: #3157b7;
  --pencil-bg: #e3e9f7;
  --warn: #9a5a12;
  --font-sans: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Noto Sans SC", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15171a; --sheet: #1c1f23; --ink: #e6e8ea; --soft: #9aa0a8; --line: #3a3f46;
    --pencil: #8eabf2; --pencil-bg: #222c44; --warn: #e0a560; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15171a; --sheet: #1c1f23; --ink: #e6e8ea; --soft: #9aa0a8; --line: #3a3f46;
  --pencil: #8eabf2; --pencil-bg: #222c44; --warn: #e0a560; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; display: grid; gap: 22px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--pencil); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
h1 { margin: 2px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
.keys { font-family: var(--font-mono); font-size: 12px; color: var(--soft); }
.keys kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sheet); }

/* Flow map */
.map { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 10px; overflow-x: auto; }
.lane { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
.lane-label { font-family: var(--font-mono); font-size: 11.5px; color: var(--soft); width: 72px; flex: none; }
.node { border: 1px dashed var(--line); background: transparent; border-radius: 6px; padding: 4px 9px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.node .n { font-family: var(--font-mono); color: var(--soft); margin-right: 5px; font-size: 11.5px; }
.node.seen { border-style: solid; }
.node.here { background: var(--pencil-bg); border: 1px solid var(--pencil); color: var(--pencil); }
.node.here .n { color: var(--pencil); }
.arrow { color: var(--soft); font-size: 12px; }

/* Stage */
.stage { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; }
@media (max-width: 860px) { .stage { grid-template-columns: 1fr; } }
.scene { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 14px; justify-items: center; min-width: 0; }
.scene-meta { justify-self: stretch; display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-mono); font-size: 12px; color: var(--soft); flex-wrap: wrap; }

.device { border: 2px solid var(--ink); background: var(--paper); display: grid; place-items: center; text-align: center; position: relative; max-width: 100%; }
.device .inner { display: grid; gap: 8px; padding: 22px; justify-items: center; width: 100%; }
.d-hub { width: min(380px, 100%); aspect-ratio: 1; border-radius: 50%; box-shadow: 0 0 0 10px var(--sheet), 0 0 0 11px var(--line); }
.d-hub .inner { padding: 14%; }
.d-laptop { width: min(560px, 100%); aspect-ratio: 16 / 10; border-radius: 10px 10px 4px 4px; border-bottom-width: 12px; }
.d-phone { width: min(260px, 100%); aspect-ratio: 9 / 18; border-radius: 30px; }
.d-tv { width: min(580px, 100%); aspect-ratio: 16 / 9; border-radius: 4px; border-width: 6px; }
.d-tablet { width: min(560px, 100%); aspect-ratio: 4 / 3; border-radius: 18px; border-width: 10px; }
.d-card { width: min(520px, 100%); border-radius: 10px; border-style: dashed; }
.devlabel { font-family: var(--font-mono); font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: .08em; }

.big { font-family: var(--font-mono); font-size: clamp(30px, 7vw, 46px); font-weight: 500; line-height: 1; letter-spacing: -.02em; }
.mid { font-size: 17px; font-weight: 600; line-height: 1.35; text-wrap: balance; }
.small { font-size: 12.5px; color: var(--soft); line-height: 1.5; }
.fine { font-size: 11.5px; color: var(--soft); max-width: 34em; line-height: 1.45; }
.rows { display: grid; gap: 3px; font-size: 12.5px; width: 100%; max-width: 360px; text-align: left; }
.rows div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding-block: 2px; }
.rows span:last-child { font-family: var(--font-mono); }
.searchbar { width: 100%; max-width: 440px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 6px 14px; text-align: left; font-size: 14px; }
.toast { border: 1.5px solid var(--ink); border-radius: 12px; padding: 8px 10px; text-align: left; font-size: 12px; width: 100%; line-height: 1.4; }
.ph { border: 1px dashed var(--soft); border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--soft); }
.tiles { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tiles .ph { width: 30%; min-width: 90px; }
.pill { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--ink); border-radius: 999px; padding: 1px 8px; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.choice { border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 500; }
.choice.primary { background: var(--ink); color: var(--sheet); }
.choice:hover { border-color: var(--pencil); }

/* Notes */
.notes { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.notes h2 { margin: 0; font-size: 18px; font-weight: 600; }
.notes .who { margin: 0; font-family: var(--font-mono); font-size: 12px; color: var(--soft); }
.notes p { margin: 0; }
.notes .line { border-left: 2px solid var(--line); padding-left: 10px; color: var(--ink); }
.notes .todo { color: var(--warn); font-size: 13.5px; }
.notes .todo::before { content: "待定 · "; font-family: var(--font-mono); font-size: 12px; }
.navrow { display: flex; gap: 8px; flex-wrap: wrap; }
.navrow button { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.assume { font-size: 13px; color: var(--soft); border-top: 1px dashed var(--line); padding-top: 10px; }
@media (prefers-reduced-motion: no-preference) { .device { transition: transform .2s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">HUSH · Final 交互原型 · 流程草图 v0.2</p>
      <h1>先确认顺序，再做高保真</h1>
    </div>
    <div class="keys"><kbd>→</kbd> 走主选项　<kbd>←</kbd> 返回　<kbd>R</kbd> 重来</div>
  </header>

  <nav class="map" id="map" aria-label="流程图"></nav>

  <div class="stage">
    <section class="scene" aria-live="polite">
      <div class="scene-meta"><span id="when"></span><span id="where"></span></div>
      <div id="device"></div>
      <div class="choices" id="choices"></div>
    </section>
    <aside class="notes">
      <p class="who" id="sid"></p>
      <h2 id="ntitle"></h2>
      <div id="nbody" style="display:grid;gap:10px"></div>
      <div class="navrow">
        <button id="back" type="button">← 返回</button>
        <button id="restart" type="button">从头开始</button>
      </div>
      <p class="assume">这版用的默认假设：买的路保留，作为对照；事后补救放在主线里；月报是 iPad 页面，不在主线上；文案和数字先由我起草，最终由你们确认。灰框只是占位，不代表最终样子。</p>
    </aside>
  </div>
</div>

      html: '<span class="devlabel">Phone · lock screen</span><div class="toast"><b>Employment Profile Updated</b><br>Recent career-change activity detected.<br>Source: Browser activity · Added to connected profile services</div><div class="small">一秒后消失</div>',

    ["买", ["buy1", "active1", "okresult"]],
    ["不买", ["results", "toast", "tv", "work", "hublate", "buy2"]],
    ["结尾", ["nextmonth"]],
    ["旁支", ["report"]]
  ];

  var history = [], current = "hub0", seen = {};
  var $ = function (id) { return document.getElementById(id); };

  function renderMap() {
    var html = "";
    LANES.forEach(function (lane) {
      html += '<div class="lane"><span class="lane-label">' + lane[0] + '</span>';
      lane[1].forEach(function (id, i) {
        var s = S[id];
        if (i) html += '<span class="arrow" aria-hidden="true">→</span>';
        var cls = "node" + (id === current ? " here" : "") + (seen[id] ? " seen" : "");
        html += '<button type="button" class="' + cls + '" data-go="' + id + '"' + (id === current ? ' aria-current="step"' : "") + '><span class="n">' + s.n + '</span>' + s.label + '</button>';
      });
      html += "</div>";
    });
    $("map").innerHTML = html;
  }

  function render() {
    var s = S[current];
    seen[current] = true;
    $("when").textContent = s.when;
    $("where").textContent = s.where;
    $("device").innerHTML = '<div class="device d-' + s.dev + '"><div class="inner">' + s.html + "</div></div>";
    $("choices").innerHTML = s.choices.map(function (c) {
      return '<button type="button" class="choice' + (c[2] ? " primary" : "") + '" data-go="' + c[1] + '">' + c[0] + "</button>";
    }).join("");
    $("sid").textContent = "屏幕 " + s.n + " · " + s.lane;
    $("ntitle").textContent = s.title;
    $("nbody").innerHTML = s.body.join("");
    $("back").disabled = history.length === 0;
    renderMap();
  }

  function go(id, push) {
    if (!S[id] || id === current) return;
    if (push !== false) history.push(current);
    current = id;
    render();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]");
    if (t) go(t.getAttribute("data-go"));
  });
  $("back").addEventListener("click", function () { if (history.length) { current = history.pop(); render(); } });
  $("restart").addEventListener("click", function () { history = []; current = "hub0"; render(); });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea")) return;
    if (e.key === "ArrowRight") { var p = S[current].choices.filter(function (c) { return c[2]; })[0]; if (p) go(p[1]); }
    else if (e.key === "ArrowLeft") { if (history.length) { current = history.pop(); render(); } }
    else if (e.key === "r" || e.key === "R") { history = []; current = "hub0"; render(); }
  });

  render();
})();
</script>
